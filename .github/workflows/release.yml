name: Release

# Runs on every push to main, but a push is not a release. What the run does
# depends on whether changesets are pending:
#
#   changesets pending  -> open or update the "chore: version packages" PR.
#                          Nothing is published.
#   none pending        -> the version PR has just been merged, so the bumped
#                          version is on main. Publish it to npm.
#
# So the gate on publishing is merging the version PR, which is a deliberate
# human action with the exact version bump and changelog in front of you.
# workflow_dispatch is kept for re-running a release that failed after the
# merge, without an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # commit the version bump, push tags
      pull-requests: write # open the "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets diffs against the base branch

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm publishes the package: it is the client that supports trusted
      # publishing, so no NPM_TOKEN is stored anywhere.
      #
      # Deliberately no `registry-url`. Setting it makes setup-node write an
      # .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # and point NPM_CONFIG_USERCONFIG at it. With no NODE_AUTH_TOKEN in the
      # environment that resolves to an empty credential, and an explicit
      # authToken in .npmrc takes precedence over OIDC — so npm signs the
      # provenance, then sends the empty token and the registry answers
      # `404 Not Found - PUT`, which reads like a missing package rather than an
      # auth failure. The registry defaults to npmjs.org anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use an npm that supports trusted publishing
        # Trusted publishing (OIDC) needs npm >= 11.5.1. Node 22 ships npm 10.
        run: npm install -g npm@^11.5.1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify before releasing
        # A release must not be the first place these run. CI already gates the
        # PR; this rejects anything that reached main another way.
        run: bun run check:ci

      - name: Create the version PR, or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # `version` writes the bump and changelog; the action opens a PR with
          # them. Merging that PR runs this workflow again with no changesets
          # left, and `publish` then goes to npm.
          version: bun run version:packages
          publish: bun run release:packages
          title: "chore: version packages"
          commit: "chore: version packages"
          # Tag the published version on GitHub and use the CHANGELOG entry
          # changesets just wrote as the release body. This is the action's
          # default; stated explicitly so a future default flip cannot silently
          # stop producing releases. Needs `contents: write`, granted above.
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Report
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "$PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
